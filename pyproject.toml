[project]
name = "tw-stock-breakout-scanner"
version = "0.5.0"
description = "台股強勢突破交易清單掃描器（換手率版）"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "streamlit>=1.35",
    "plotly>=5.18",
    "psycopg2-binary>=2.9",
    "pg8000>=1.31",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".cache"]

[tool.ruff.lint]
# 預設（pyflakes + 語法錯誤）+ import 排序
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["twscanner"]
