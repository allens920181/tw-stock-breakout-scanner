[theme]
# 中性墨黑 + 白底 + 淺灰填色；不用框線區隔元件（見 docs/DESIGN.md）
primaryColor = "#18181B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F5"
textColor = "#18181B"
borderColor = "#E4E4E7"
dataframeBorderColor = "#EFEFF1"
dataframeHeaderBackgroundColor = "#FAFAFA"
showWidgetBorder = false
showSidebarBorder = false
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
linkColor = "#2563EB"
font = "sans serif"

[server]
runOnSave = true
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"   # 隱藏 Deploy 等開發者按鈕
